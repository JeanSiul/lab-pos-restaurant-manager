name: Import restaurant-manager benchmark

on:
  push:
    paths:
      - '.github/workflows/import-restaurant-manager.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import source cleanly
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/siddik-web/restaurant-manager.git "$tmp/src"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} + || true
          cp -a "$tmp/src/." "$tmp/imported"
          rm -rf "$tmp/imported/.git"
          cp -a "$tmp/imported/." .
          cat > vercel.json <<'EOF'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          EOF
          cat > BENCHMARK_SOURCE.md <<'EOF'
          # Benchmark source

          Source: https://github.com/siddik-web/restaurant-manager

          This repository is an isolated evaluation copy for restaurant POS UX and workflow analysis.
          The upstream README states that the project is licensed under the MIT License.
          EOF

      - name: Commit imported benchmark
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: import restaurant-manager benchmark"
          git push origin HEAD:main

# bootstrap trigger 2
